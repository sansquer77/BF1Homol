features:
- buildpack-stack=ubuntu-22
ingress:
  rules:
  - component:
      name: bf1-frontend
    match:
      path:
        prefix: /
  - component:
      name: bf1-api
    match:
      path:
        prefix: /api
name: bf1homol
region: nyc
services:
- environment_slug: python
  envs:
  - key: DATABASE_URL
    scope: RUN_TIME
    value: ${bolaof1.DATABASE_URL}
  github:
    branch: main
    deploy_on_push: true
    repo: sansquer77/BF1Homol
  http_port: 8000
  instance_count: 1
  instance_size_slug: apps-s-1vcpu-0.5gb
  name: bf1-api
  run_command: uvicorn api.main:app --host 0.0.0.0 --port 8000
  source_dir: /
- environment_slug: node-js
  envs:
  - key: BF1_API_ORIGIN
    scope: RUN_AND_BUILD_TIME
    value: http://bf1-api:8000
  github:
    branch: main
    deploy_on_push: true
    repo: sansquer77/BF1Homol
  http_port: 3000
  instance_count: 1
  instance_size_slug: apps-s-1vcpu-0.5gb
  name: bf1-frontend
  build_command: npm install && npm run build
  run_command: npm run start -- --hostname 0.0.0.0 --port 3000
  source_dir: /frontend
